<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manila</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b06; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: #e9dfb8; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(13, 11, 6, .72); text-align: center; padding: 16px; }
  #menu h1 { margin: 0; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; font-size: 28px; }
  #menu button { font: inherit; padding: 10px 28px; background: #e9dfb8; color: #1a160c; border: 0; border-radius: 3px; cursor: pointer; }
  #menu small { opacity: .7; }
  #menu.off { display: none; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px ui-monospace, monospace; opacity: .55; pointer-events: none; white-space: pre; }
  #vl { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; font-size: 13px; }
  #vl label { display: flex; align-items: center; gap: 10px; }
  #vl input { width: 160px; accent-color: #e9dfb8; }
  #vl select { font: inherit; background: #1a160c; color: #e9dfb8; border: 1px solid rgba(233, 223, 184, .4); border-radius: 3px; padding: 3px 6px; }
  #ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-size: 13px; }
  #ph button { padding: 5px 14px; background: transparent; color: #e9dfb8; border: 1px solid rgba(233, 223, 184, .5); }
  #ph button:disabled { opacity: .35; cursor: default; }
  #vhs { position: fixed; inset: 0; pointer-events: none; font: bold 3.6vh "Courier New", monospace; color: #f4f1e0; text-shadow: .25vh .25vh 0 rgba(0,0,0,.85); }
  #vhs.off { display: none; }
  #vhs .play { position: absolute; left: 6.4vh; top: 5.6vh; }
  #vhs .stamp { position: absolute; right: 6.4vh; bottom: 5.6vh; text-align: right; line-height: 1.2; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #sd { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 13px; }
  #sd input { font: inherit; background: rgba(0,0,0,.35); color: #e9dfb8; border: 1px solid rgba(233, 223, 184, .4); border-radius: 3px; padding: 4px 8px; }
  #sd button { padding: 5px 12px; background: transparent; color: #e9dfb8; border: 1px solid rgba(233, 223, 184, .5); }
  #ver { opacity: .4; font-size: 11px; }
  #err { color: #ffb4a0; max-width: 520px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <h1>Manila</h1>
  <button id="go">Enter</button>
  <div id="vl"><label>Volume <input id="vol" type="range" min="0" max="100" value="50"></label><label>Mouse <input id="sens" type="range" min="0" max="100" value="50"></label>
    <label>Graphics <select id="gfx"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></label></div>
  <small>WASD move &middot; mouse look &middot; Shift run &middot; C crouch &middot; right-click zoom &middot; M mute &middot; H stats &middot; Esc menu</small>
  <small>F drone (Space up, C down) &middot; P photo &middot; O auto camera &middot; V camcorder look</small>
  <div id="ph"><span id="phn"></span><button id="phsave">Save all (.zip)</button><button id="phdir">Save straight to a folder</button></div>
  <div id="sd"><label>Seed <input id="seedin" inputmode="numeric" size="9"></label><button id="seedgo">Go</button><button id="seednew">New random</button>
    <input id="goto" placeholder="Paste a line from where.txt to go there" size="34"></div>
  <small id="err"></small>
  <small id="ver"></small>
</div>
<div id="vhs" class="off"><div class="play">PLAY &#9654;</div><div class="stamp"><div id="vhstime"></div><div id="vhsdate"></div></div></div>
<div id="flash"></div>
<div id="hud"></div>
<script>/*SCRIPT*/</script>
</body>
</html>
